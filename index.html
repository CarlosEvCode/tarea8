<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificador de Formas</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Librerías de P5.js y ML5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  </head>
  <body>
    <div class="test-container">
        <h1>Clasificador de Formas</h1>
        <p>Dibuja un círculo, triángulo o cuadrado en el lienzo</p>

        <!-- Contenedor del Canvas -->
        <div id="canvas"></div>

        <!-- Controles -->
        <div class="controls">
            <button id="boton-limpiar" class="btn-minimal">Limpiar Lienzo</button>
        </div>

        <!-- Resultados -->
        <div class="result-box">
            <div id="resultado-texto">Cargando modelo...</div>
        </div>
    </div>

    <script>
      let shapeClassifier;
      let canvas;
      let inputImage;

      // Configuración inicial
      function setup() {
        // Crear el canvas y colocarlo en el contenedor HTML
        canvas = createCanvas(400, 400);
        canvas.parent("canvas");

        // Configuración de la red neuronal
        let options = {
          inputs: [64, 64, 4], 
          task: "imageClassification",
        };

        shapeClassifier = ml5.neuralNetwork(options);

        // Ubicación de nuestro modelo ya entrenado
        const modelDetails = {
          model: "model/model.json",
          metadata: "model/model_meta.json",
          weights: "model/model.weights.bin",
        };

        background(255);

        // Escuchar el clic del botón limpiar
        document.getElementById("boton-limpiar").addEventListener("click", cleanCanvas);

        inputImage = createGraphics(64, 64);

        // Cargar el modelo entrenado
        shapeClassifier.load(modelDetails, modelLoaded);
      }

      function modelLoaded() {
        classifyImage();
      }

      // Analizar el canvas en tiempo real
      function classifyImage() {
        inputImage.copy(canvas, 0, 0, width, height, 0, 0, 64, 64);
        shapeClassifier.classify({ image: inputImage }, gotResults);
      }

      function cleanCanvas() {
        background(255);
      }

      // Pintar sobre el canvas al presionar el mouse
      function draw() {
        if (mouseIsPressed) {
          strokeWeight(8);
          stroke(0);
          line(pmouseX, pmouseY, mouseX, mouseY);
        }
      }

      // Recibir resultados del clasificador
      function gotResults(err, result) {
        if (err) {
          console.error(err);
          return;
        }

        let descripcion = result[0].label;
        let confianza = result[0].confidence;

        // Mostrar resultados en el HTML
        document.getElementById("resultado-texto").innerHTML = 
          descripcion.toUpperCase() + " - Confianza: " + (confianza * 100).toFixed(2) + "%";

        classifyImage();
      }
    </script>
  </body>
</html>
